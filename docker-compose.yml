version: '3.8'

services:
  # ==================== Redis 缓存服务 ====================
  redis:
    image: redis:7-alpine
    container_name: edugenius-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - edugenius-network

  # ==================== 后端 API 服务 ====================
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: edugenius-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 数据库配置
      - DATABASE_URL=sqlite+aiosqlite:///./edugenius.db

      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true

      # ChromaDB 配置
      - CHROMA_PERSIST_DIR=/app/chroma_db

      # API 密钥（从环境变量传入）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # JWT 密钥（从环境变量传入）
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}

      # 应用配置
      - DEBUG=False
      - DEFAULT_MODEL=qwen-max
      - FALLBACK_MODEL=qwen-plus

      # CORS 配置
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000

      # 日志配置
      - LOG_LEVEL=INFO

      # 文档处理配置
      - MAX_FILE_SIZE_MB=50
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200

      # OCR 配置
      - OCR_TEXT_RATIO_THRESHOLD=0.1
      - OCR_CONFIDENCE_THRESHOLD=0.6
      - OCR_MAX_CONCURRENT=2

      # 前端 URL
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - backend_data:/app/data
      - chroma_db:/app/chroma_db
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - edugenius-network

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edugenius-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_MAX_FILE_SIZE=52428800
      - NEXT_PUBLIC_TOKEN_EXPIRE_MINUTES=120
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - edugenius-network

# ==================== 数据卷 ====================
volumes:
  redis_data:
    driver: local
  backend_data:
    driver: local
  chroma_db:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local

# ==================== 网络 ====================
networks:
  edugenius-network:
    driver: bridge
